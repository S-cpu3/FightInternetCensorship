<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Embedded Snowflake</title>
  <style>
    /* Page reset and center */
    html,body { height:100%; margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; background:#f7f7f8; color:#111; display:flex; align-items:center; justify-content:center; }

    /* Responsive iframe container: keeps aspect ratio */
    .iframe-wrap {
      width: 100%;
      max-width: 420px; /* limit max width */
      background:#fff;
      border:1px solid #e3e3e6;
      border-radius:8px;
      box-shadow:0 6px 18px rgba(16,24,40,0.06);
      padding:16px;
      box-sizing:border-box;
    }

    /* Maintain the 320x240 aspect ratio (4:3) */
    .responsive-iframe {
      position:relative;
      width:100%;
      padding-top:75%; /* 3/4 = 75% for 4:3 ratio */
      overflow:hidden;
      border-radius:6px;
    }

    .responsive-iframe iframe {
      position:absolute;
      top:0; left:0;
      width:100%;
      height:100%;
      border:0;
    }

    /* Caption & small controls */
    .caption { margin-top:12px; font-size:13px; color:#555; display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .small { font-size:12px; color:#6b7280; }
    .link { color:#2563eb; text-decoration:none; }
  </style>
</head>
<body>
  <div class="iframe-wrap" role="region" aria-label="Snowflake embed">
    <div class="responsive-iframe">
      <iframe src="https://snowflake.torproject.org/embed.html"
              width="320" height="240" frameborder="0" scrolling="no"
              title="Snowflake embed"></iframe>
    </div>

    <div class="caption">
      <div class="small">Snowflake embed (320×240, responsive)</div>
      <a class="link" href="https://snowflake.torproject.org/" target="_blank" rel="noopener noreferrer">Open project</a>
    </div>
  </div>
</body>
</html>
